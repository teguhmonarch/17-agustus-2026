services:
  db:
    image: postgres:14-alpine
    container_name: cip-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cip
    shm_size: 1gb
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=5GB"
      - "-c"
      - "maintenance_work_mem=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
    # Postgres is reachable only on the compose network. Publishing 5432 with
    # the default postgres/postgres credentials got this database wiped by an
    # automated ransomware scanner mid-event; the API talks to db:5432 over the
    # internal network and never needed the host port.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: node:20-alpine
    container_name: cip-api
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --omit=dev && node server.js"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cip
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
